<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e8eaf0;--mut:#8b93a7;--acc:#ff4d4d;--ok:#3ddc97;--b:#5b9cff}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:20px 24px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:22px}h1 span{color:var(--acc)}.sub{color:var(--mut);font-size:12px}
.wrap{padding:0 24px 32px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:24px}.kpi small{color:var(--mut)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input,select,button{background:#0c0e12;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input[type=search]{flex:1;min-width:220px}button{cursor:pointer}button:hover{border-color:var(--b)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--card)}
th.s::after{content:" \25BE"}th.s.asc::after{content:" \25B4"}
tr:hover td{background:#1c2029}td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{max-height:70vh;overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.thumb{width:96px;height:54px;object-fit:cover;border-radius:6px;display:block;background:#222}
.kw{font-weight:600}.tt{color:var(--mut);font-size:12px;max-width:380px}a{color:var(--b);text-decoration:none}a:hover{text-decoration:underline}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#222836;font-size:12px;color:#c9d1e3}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.bar i{display:block;height:10px;border-radius:5px;background:var(--acc)}
.bar span:first-child{width:90px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs{font-size:11px;color:var(--mut)}.up{color:var(--ok)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;padding:18px}
#modal img{width:100%;border-radius:10px}#modal dl{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;margin:12px 0}#modal dt{color:var(--mut)}
</style></head><body>
